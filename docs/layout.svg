<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 346" width="880" height="346" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .mono { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .monosm { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #57606a; }
    .note { font-size: 11.5px; fill: #57606a; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.4; rx: 8; }
    .tablebox { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.4; rx: 8; }
    .packbox { fill: #ddf4ff; stroke: #1f6feb; stroke-width: 1.6; rx: 8; }
    .member { fill: #ffffff; stroke: #54aeff; stroke-width: 1.2; rx: 4; }
    .arrow { stroke: #1f6feb; stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .rootline { stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <text class="title" x="20" y="28">A Blob-Referenced Columnar Dataset (BRCD) is one self-contained folder</text>

  <rect class="box" x="20" y="44" width="840" height="286"/>
  <text class="mono" x="36" y="68">dataset/</text>
  <path class="rootline" d="M 44 76 L 44 296"/>

  <!-- tables -->
  <rect class="tablebox" x="60" y="84" width="370" height="124"/>
  <text class="mono" x="76" y="106">table/</text>
  <text class="note" x="130" y="106">columnar data + a string reference per blob</text>
  <text class="monosm" x="76" y="132">image_ref</text>
  <text class="monosm" x="362" y="132">label</text>
  <line x1="76" y1="140" x2="414" y2="140" stroke="#d0d7de" stroke-width="1"/>
  <text class="monosm" x="76" y="160">zip://img/000001.jpg::media/…</text>
  <text class="monosm" x="362" y="160">3</text>
  <text class="monosm" x="76" y="180">zip://clips/ep0.mp4::media/…</text>
  <text class="monosm" x="362" y="180">1</text>

  <!-- packs -->
  <rect class="packbox" x="480" y="84" width="364" height="124"/>
  <text class="mono" x="496" y="106">media/</text>
  <text class="note" x="550" y="106">Blob Pack: STORED zip shards</text>
  <rect class="member" x="496" y="120" width="150" height="24"/>
  <text class="monosm" x="506" y="136">pack-0000.zip</text>
  <rect class="member" x="496" y="152" width="150" height="24"/>
  <text class="monosm" x="506" y="168">pack-0001.zip</text>
  <text class="monosm" x="506" y="196">…</text>

  <path class="arrow" d="M 436 156 L 476 156"/>

  <!-- inside a shard -->
  <rect class="box" x="60" y="226" width="784" height="86"/>
  <text class="mono" x="76" y="248">inside pack-0000.zip</text>
  <rect class="member" x="76" y="260" width="132" height="28"/>
  <text class="monosm" x="86" y="278">img/000001.jpg</text>
  <rect class="member" x="216" y="260" width="140" height="28"/>
  <text class="monosm" x="226" y="278">clips/ep0.mp4</text>
  <rect class="member" x="364" y="260" width="120" height="28"/>
  <text class="monosm" x="374" y="278">audio/u17.flac</text>
  <text class="note" x="500" y="278">each blob: one positioned read</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .label { font-size: 12.5px; fill: #1f2328; }
    .mono { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .monosm { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #57606a; }
    .note { font-size: 11.5px; fill: #57606a; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.4; rx: 8; }
    .tablebox { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.4; rx: 8; }
    .packbox { fill: #ddf4ff; stroke: #1f6feb; stroke-width: 1.6; rx: 8; }
    .member { fill: #ffffff; stroke: #54aeff; stroke-width: 1.2; rx: 4; }
    .arrow { stroke: #1f6feb; stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .rootline { stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <text class="title" x="20" y="28">A Blob Pack dataset is one self-contained folder</text>
  <text class="note" x="20" y="48">Tables hold the annotations and a string reference per blob; the media sit beside them in uncompressed zip shards.</text>

  <rect class="box" x="20" y="66" width="840" height="344"/>
  <text class="mono" x="36" y="90">dataset/</text>
  <path class="rootline" d="M 44 98 L 44 372"/>

  <!-- table side -->
  <rect class="tablebox" x="60" y="106" width="360" height="150"/>
  <text class="mono" x="76" y="128">table/  (HF Datasets or parquet)</text>
  <text class="monosm" x="76" y="152">image_ref</text>
  <text class="monosm" x="352" y="152">label</text>
  <line x1="76" y1="160" x2="404" y2="160" stroke="#d0d7de" stroke-width="1"/>
  <text class="monosm" x="76" y="180">zip://img/000001.jpg::media/…</text>
  <text class="monosm" x="352" y="180">3</text>
  <text class="monosm" x="76" y="200">zip://img/000002.jpg::media/…</text>
  <text class="monosm" x="352" y="200">7</text>
  <text class="monosm" x="76" y="220">zip://clips/ep0.mp4::media/…</text>
  <text class="monosm" x="352" y="220">1</text>
  <text class="note" x="76" y="244">columnar ops never touch blob bytes</text>

  <!-- packs side -->
  <rect class="packbox" x="470" y="106" width="374" height="150"/>
  <text class="mono" x="486" y="128">media/  (STORED zip shards)</text>
  <rect class="member" x="486" y="142" width="164" height="26"/>
  <text class="monosm" x="496" y="159">pack-0000.zip</text>
  <rect class="member" x="486" y="176" width="164" height="26"/>
  <text class="monosm" x="496" y="193">pack-0001.zip</text>
  <rect class="member" x="486" y="210" width="164" height="26"/>
  <text class="monosm" x="496" y="227">pack-0002.zip</text>
  <text class="note" x="668" y="160">each ≤ 4 GiB,</text>
  <text class="note" x="668" y="178">≤ 65,535 members,</text>
  <text class="note" x="668" y="196">no compression,</text>
  <text class="note" x="668" y="214">readable by any</text>
  <text class="note" x="668" y="232">zip tool</text>

  <path class="arrow" d="M 428 182 L 466 182"/>
  <text class="note" x="447" y="172" text-anchor="middle" font-size="10.5">resolves</text>

  <!-- inside a shard -->
  <rect class="box" x="60" y="278" width="784" height="112"/>
  <text class="mono" x="76" y="300">inside pack-0000.zip</text>
  <rect class="member" x="76" y="312" width="132" height="30"/>
  <text class="monosm" x="86" y="331">img/000001.jpg</text>
  <rect class="member" x="216" y="312" width="132" height="30"/>
  <text class="monosm" x="226" y="331">img/000002.jpg</text>
  <rect class="member" x="356" y="312" width="150" height="30"/>
  <text class="monosm" x="366" y="331">clips/ep0.mp4</text>
  <rect class="member" x="514" y="312" width="120" height="30"/>
  <text class="monosm" x="524" y="331">audio/u17.flac</text>
  <text class="monosm" x="646" y="331">…</text>
  <text class="note" x="76" y="362">Every member is a contiguous, uncompressed byte range, so a reader indexes offsets once and serves each blob</text>
  <text class="note" x="76" y="380">with a single positioned read. Video and audio stay in their own containers, addressed by time interval.</text>
</svg>
